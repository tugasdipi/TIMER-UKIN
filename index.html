    .eyebrow {font-size:11px;color:var(--gold);font-weight:850;letter-spacing:.16em;text-transform:uppercase}
    .identity h1 {font-size:22px;font-weight:800;line-height:1.15;margin:3px 0 0;letter-spacing:-.03em}
    .universal-tag{display:inline-flex;vertical-align:middle;align-items:center;margin-left:6px;padding:3px 7px;border-radius:7px;border:1px solid #55768a;color:var(--cyan);background:#244254;font-size:9px;letter-spacing:.12em;font-weight:900}
    .topactions {display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .button {border:1px solid var(--line);border-radius:12px;background:#182c46;color:var(--white);padding:11px 14px;font-weight:700;transition:background .15s,border-color .15s,transform .15s}

    .preset-right {display:flex;align-items:center;gap:9px;flex-wrap:wrap}

    .layout {display:grid;grid-template-columns:minmax(0,1.26fr) minmax(390px,.93fr);gap:18px;align-items:start}
    .card {background:linear-gradient(150deg,#142941,#0d2035);border:1px solid #2b4560;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}

    .phase-progress > div {background:linear-gradient(90deg,#64dad8,#e9c781);height:100%;width:0%;border-radius:inherit;transition:width .3s}
    .phase-progress-meta {width:min(100%,620px);display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:9px 0 6px;font-variant-numeric:tabular-nums}

    .metric strong {font-size:25px;letter-spacing:-.035em;display:block;font-variant-numeric:tabular-nums}
    .metric span {font-size:12px;color:var(--muted);display:block;margin-top:2px}

    .stage-row {display:grid;grid-template-columns:40px minmax(0,1fr) 85px;gap:9px;align-items:center;padding:10px 10px;border-radius:13px;background:#12273e;border:1px solid transparent;transition:background .15s}
    .stage-row.active {border-color:#bd9f63;background:#283548}

    .stage-row.completed:not(.active) .jump {color:var(--green)}
    .stage-fields {min-width:0}
    .phase-name {width:100%;padding:3px 2px;background:transparent;color:#f8fbff;border:1px solid transparent;border-radius:4px;font-size:14px;font-weight:750;min-width:0;text-overflow:ellipsis}

    .module-edit label {font-size:11px;font-weight:750;color:var(--muted);display:block;margin-bottom:4px}

    .module-edit input::placeholder {color:#7e96ae;font-weight:450}
    .stage-details {grid-column:1/-1;border-top:1px solid #29445d;margin-top:5px;padding-top:6px;min-width:0}

    .tools-bottom {display:flex;gap:8px;flex-wrap:wrap;padding:2px 20px 16px}
    .stage-cue {white-space:pre-line;overflow-wrap:anywhere}
    .duration {position:relative}
    .minute-input {width:100%;background:#091b30;border:1px solid #3a5470;border-radius:9px;padding:8px 24px 8px 7px;color:#fff;text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}
    .minute-input::-webkit-outer-spin-button,.minute-input::-webkit-inner-spin-button {-webkit-appearance:none;margin:0}
    .unit {position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#90a9c0;font-size:10px;pointer-events:none}
    .config {padding:17px 20px 18px}
    .config h3 {margin:0 0 13px;font-size:16px}
    .setting {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #2b425a}
    .setting:first-of-type {border-top:none}
    .setting-name {color:#e7eff9;font-size:13px;font-weight:750}
    .setting-help {color:#96acc1;font-size:11px;margin-top:2px}
    .toggle {position:relative;display:inline-block;flex:0 0 45px;height:26px}
    .toggle input {opacity:0;width:0;height:0;position:absolute}
    .track {position:absolute;inset:0;border-radius:30px;background:#30445c;border:1px solid #4a627c;transition:background .2s}
    .track::after {content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#d3dde7;transition:transform .2s}
    .toggle input:checked + .track {background:#c7a66a}
    .toggle input:checked + .track::after {transform:translateX(19px);background:#162438}
    .notice {display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:min(92vw,560px);z-index:1000;padding:13px 18px;border:1px solid #ac935e;background:#2a3445;color:#fff;border-radius:13px;box-shadow:0 10px 40px #000a;text-align:center;font-weight:700;font-size:13px}
    .notice.show {display:block}
    .focus-mode .presets,.focus-mode .side-panel {display:none}
    .focus-mode .layout {grid-template-columns:1fr}
    .focus-mode .timer-card {min-height:calc(100vh - 145px)}
    .focus-mode .timer-main {padding:30px}
    .focus-mode .digits {font-size:clamp(92px,14vw,245px)}

    .focus-mode .stage-cue {font-size:clamp(22px,2.3vw,32px);max-width:900px;min-height:72px}

    @media(max-width:1080px) {.layout {grid-template-columns:1fr}.timer-card {min-height:600px}.stages {max-height:none}.side-panel{display:grid;grid-template-columns:1fr 1fr}.side-panel .card:first-child {grid-row:1 / 3}.side-panel .config {align-self:start}.side-panel > .card:nth-child(2) {height:max-content}}
    @media(max-width:700px) {.shell{padding:15px 12px 22px}.topbar{margin-bottom:15px}.identity h1{font-size:18px}.mark{width:42px;height:42px}.presets{padding:13px}.preset{padding:9px 10px;min-width:70px}.layout{gap:12px}.side-panel{display:flex}.timer-head{padding:20px 18px 8px}.timer-card{min-height:565px}.timer-main{padding:10px 15px}.stage-title{font-size:25px}.stage-cue{font-size:16px;line-height:1.4;max-width:92vw;min-height:44px}.digits{font-size:clamp(63px,14vw,100px);margin:10px 0 9px}.timer-controls{padding:13px 12px 4px}.timer-controls .button{padding:10px 11px}.timer-controls .play{min-width:130px}.timer-bottom{margin:12px 15px 20px;gap:4px}.metric strong{font-size:19px}.metric span{font-size:11px}.stage-row{grid-template-columns:35px minmax(0,1fr) 78px;gap:6px;padding:9px 6px}.stage-row .jump{width:30px;height:31px}.focus-mode .timer-card{min-height:calc(100dvh - 175px)}.focus-mode .digits{font-size:clamp(68px,17vw,140px)}}

    /* MODE PANTAU: hanya dua metrik yang paling relevan; menggunakan ruang

    .timer-bottom {grid-template-columns:repeat(2,minmax(0,1fr));gap:0}

<body>
  <div class="shell" id="app">
    <header class="topbar">
      <div class="identity"><div class="mark" aria-hidden="true">◷</div><div><div class="eyebrow">UKPPG Calon Guru</div><h1>UKin Timer</h1></div></div>
      <div id="headerNavSlot" class="header-nav-slot" aria-label="Navigasi timer di mode fokus"></div>
      <div class="topactions">
        <button id="focusButton" class="button small" title="Sembunyikan daftar tahapan">◉ Mode Fokus</button>
        <button id="fullscreenButton" class="button small ghost" title="Tampilkan layar penuh">⛶ Layar Penuh</button>
      </div>
    </header>
    <section class="presets" aria-label="Pilihan total durasi">
      <div class="preset-left"><span class="section-label">Total Jam Pelajaran</span><div class="preset-buttons" id="presetButtons">
        <button class="preset" data-preset="60">60 menit</button><button class="preset" data-preset="70">70 menit</button><button class="preset" data-preset="80">80 menit</button><button class="preset" data-preset="90">90 menit</button>
      </div></div>
      <div class="preset-right"><span id="totalChip" class="totals-chip">Sesuai target</span><button id="balanceButton" class="button small" title="Sesuaikan durasi lain agar jumlah sama dengan target">Samakan ke target</button><button id="restoreButton" class="button small ghost" title="Pulihkan durasi bawaan tanpa menghapus nama/keterangan dan jumlah kegiatan">Pulihkan durasi</button></div>
    </section>
    <main class="layout">
      <section class="card timer-card" aria-label="Timer utama">
        <div class="timer-head"><div id="status" class="status"><span class="dot"></span><span id="statusLabel">Siap dimulai</span></div><span id="stepCount" class="step-count">Tahap 1 dari 5</span></div>
        <div class="timer-main">

        const key=$('bundledPreset').value;
        const preset=Object.prototype.hasOwnProperty.call(bundledPresets,key)?bundledPresets[key]:null;
        if(!preset){notice('Preset tidak ditemukan.');return;}
        const button=$('loadBundledPreset');
        button.disabled=true;
        try{
          // Gunakan validasi impor yang sama seperti file JSON biasa.
          const file=new Blob([JSON.stringify(preset)],{type:'application/json'});
          await importConfig(file);
        }catch(error){notice('Gagal memuat preset: '+error.message);}
        finally{button.disabled=false;}
      });
      $('importButton').addEventListener('click',()=>$('importFile').click());
      $('importFile').addEventListener('change',e=>{importConfig(e.target.files?.[0]);e.target.value='';});
      $('presetButtons').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)applyPreset(Number(b.dataset.preset));});
      els.playButton.addEventListener('click',play);
      els.prevButton.addEventListener('click',()=>selectStage(state.index-1));
      els.nextButton.addEventListener('click',()=>selectStage(state.index+1));
      $('resetButton').addEventListener('click',resetPhase);
      $('resetAllButton').addEventListener('click',resetAll);
      els.balanceButton.addEventListener('click',balance);
      $('restoreButton').addEventListener('click',resetAllocation);
      els.autoToggle.addEventListener('change',e=>{state.auto=e.target.checked;save();});
      els.soundToggle.addEventListener('change',e=>{state.sound=e.target.checked;if(state.sound)beep(1);save();});
      els.wakeToggle.addEventListener('change',e=>{state.wake=e.target.checked;if(state.wake)requestWake();else releaseWake();save();if(state.wake&&!('wakeLock' in navigator))notice('Browser ini belum mendukung fitur cegah layar tidur.');});
      // Gunakan kontrol yang SAMA di dua lokasi agar status, shortcut,
      // dan seluruh event tetap sinkron tanpa duplikasi tombol.
      const timerControls=document.querySelector('.timer-controls');
      const headerNavSlot=$('headerNavSlot');
      const timerCard=document.querySelector('.timer-card');
      const timerBottom=document.querySelector('.timer-bottom');
      function syncControlLocation(){
        if(state.focus)headerNavSlot.appendChild(timerControls);
        else timerCard.insertBefore(timerControls,timerBottom);
      }

      // Pengukuran adaptif: maksimalkan angka tanpa menutupi judul, kegiatan berikutnya,
      // dan dua ringkasan waktu pada layar laptop yang digunakan.
      let fitScheduled=false, lastFitStage=null;
      function fitFocusNumbers(){
        if(!state.focus) return;
        const app=els.app;
        const digits=els.digits;
        const metrics=[els.overallRemaining,els.totalElapsed];
        const card=document.querySelector('.timer-card');
        const overview=document.querySelector('.stage-overview');
        const next=els.nextBox;
        const progressMeta=document.querySelector('.phase-progress-meta');
        const bottom=document.querySelector('.timer-bottom');
        const screenW=window.innerWidth, screenH=window.innerHeight;
        const mobile=screenW<=700;
        // Pada desktop gunakan seluruh ruang tampilan; di layar pendek prioritaskan tanpa scroll.
        let lower=mobile?55:100;
        let upper=mobile?Math.min(155,screenW*.42,screenH*.25):Math.min(530,screenW*.34,screenH*.56);
        const apply=(size)=>{
          app.style.setProperty('--ukin-clock-size',size.toFixed(1)+'px');
          app.style.setProperty('--ukin-metric-size',Math.min(mobile?64:158,size*(mobile?.37:.355)).toFixed(1)+'px');
        };
        const bounds=(el)=>el.getBoundingClientRect();
        const fits=()=>{
          const c=bounds(card),o=bounds(overview),d=bounds(digits),n=bounds(next),p=bounds(progressMeta),b=bounds(bottom);
          const wide=digits.scrollWidth>digits.clientWidth+2 || metrics.some(e=>e.scrollWidth>e.clientWidth+2);
          const outside=b.bottom>c.bottom-1 || c.right>screenW+1 || c.left<-1;
          const overlaps=o.bottom>d.top-3 || p.bottom>n.top-2 || n.bottom>b.top-2;
          const spills=d.left<c.left+7 || d.right>c.right-7 || (!mobile && document.documentElement.scrollHeight>screenH+2);
          return !wide&&!outside&&!overlaps&&!spills;
        };
        // Temukan ukuran terbesar dari rentang yang aman (bukan angka statis).
        apply(lower);
        if(!fits()){
          while(lower>38&&!fits()){lower-=6;apply(lower);}
          // Tetap pertahankan angka minimal bila layar sangat sempit.
        }
        let best=lower;
        for(let pass=0;pass<13;pass++){
          const mid=(lower+upper)/2;apply(mid);
          if(fits()){best=mid;lower=mid;} else {upper=mid;}
        }
        apply(Math.max(38,best-1.5));
      }
      function scheduleMaxFit(){
        if(!state.focus||fitScheduled)return;
        fitScheduled=true;
        requestAnimationFrame(()=>{fitScheduled=false;fitFocusNumbers();});
      }
      window.addEventListener('resize',scheduleMaxFit);
      document.addEventListener('fullscreenchange',scheduleMaxFit);

      els.focusButton.addEventListener('click',()=>{
        state.focus=!state.focus;
        els.app.classList.toggle('focus-mode',state.focus);
        syncControlLocation();
        if(state.focus) scheduleMaxFit();
        else {els.app.style.removeProperty('--ukin-clock-size');els.app.style.removeProperty('--ukin-metric-size');}
        els.focusButton.textContent=state.focus?'◉ Kembali ke Pengaturan':'◉ Mode Fokus';
      });
      els.fullscreenButton.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(_){notice('Layar penuh tidak tersedia di browser ini.');}});
      document.addEventListener('fullscreenchange',()=>{els.fullscreenButton.textContent=document.fullscreenElement?'⛶ Keluar Layar Penuh':'⛶ Layar Penuh';});
      document.addEventListener('keydown',e=>{
        const t=e.target;
        if(t && (t.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(t.tagName)))return;
        if(e.code==='Space'){e.preventDefault();play();}
        else if(e.key==='ArrowRight'){e.preventDefault();selectStage(state.index+1);}
        else if(e.key==='ArrowLeft'){e.preventDefault();selectStage(state.index-1);}
        else if(e.key.toLowerCase()==='r'){resetPhase();}
        else if(e.key.toLowerCase()==='f'){els.fullscreenButton.click();}
      });
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();requestWake();}else {releaseWake();save();}});
      window.addEventListener('pagehide',save);
      load();renderStages();paint();tick();setInterval(tick,180);
    })();
  </script>
</body>
</html>
